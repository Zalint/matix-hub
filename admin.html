<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matix — gestion des comptes et des accès aux modules">
    <title>Utilisateurs · Matix</title>
    <link rel="icon" type="image/jpeg" href="LogoMatix.jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-start: #0f172a;
            --bg-mid: #1e293b;
            --bg-end: #334155;
            --accent: #ef4444;
            --ok: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-bg-hover: rgba(255, 255, 255, 0.1);
        }

        html { min-height: 100%; }

        body {
            /* 100vh, not 100%: a percentage would resolve against html's auto
               height and leave the gradient short of the fold on a tall screen */
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .page { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 24px;
        }

        .pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 999px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-muted); text-decoration: none;
            font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .pill svg { width: 14px; height: 14px; }
        .pill:hover { color: var(--text); background: var(--card-bg-hover); }
        .pill:disabled { opacity: 0.5; cursor: default; }

        header h1 {
            font-size: 32px; font-weight: 700; letter-spacing: -1px;
            margin-bottom: 4px;
        }
        header p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

        .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; align-items: start; }
        @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

        .panel {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 20px;
        }
        .panel h2 {
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 14px;
        }

        .user-row {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 12px 14px; margin-bottom: 8px;
            background: transparent; border: 1px solid var(--card-border);
            border-radius: 12px; color: inherit; cursor: pointer; text-align: left;
            font-family: inherit; font-size: 14px;
            transition: background 0.2s, border-color 0.2s;
        }
        .user-row:hover { background: var(--card-bg-hover); }
        .user-row[aria-selected="true"] { border-color: var(--accent); background: var(--card-bg-hover); }
        .user-row .who { flex: 1; min-width: 0; }
        .user-row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
        .user-row .meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

        .tag {
            display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
            border: 1px solid var(--card-border); color: var(--text-muted);
        }
        .tag.admin { color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); }

        label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            background: rgba(15, 23, 42, 0.6); color: var(--text);
            border: 1px solid var(--card-border); font-family: inherit; font-size: 14px;
        }
        input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .help { color: var(--text-muted); font-size: 12px; margin-top: 6px; }

        fieldset { border: 0; margin-top: 18px; }
        legend {
            font-size: 13px; font-weight: 700; margin-bottom: 8px;
            display: flex; align-items: center; gap: 10px;
        }
        .group-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin: 18px 0 8px;
        }
        .group-head span { font-size: 13px; font-weight: 700; }
        .mini {
            background: none; border: 0; color: var(--text-muted);
            font-family: inherit; font-size: 12px; font-weight: 600;
            cursor: pointer; text-decoration: underline; padding: 2px 4px;
        }
        .mini:hover { color: var(--text); }

        .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
        .check {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--card-border); font-size: 13px; cursor: pointer;
        }
        .check:hover { background: var(--card-bg-hover); }
        .check input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        .btn {
            padding: 10px 18px; border-radius: 10px; border: 1px solid var(--card-border);
            background: var(--card-bg); color: var(--text);
            font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, border-color 0.2s, opacity 0.2s;
        }
        .btn:hover { background: var(--card-bg-hover); }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: #dc2626; }
        .btn-danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: default; }

        .flash {
            margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
            border: 1px solid var(--card-border); background: var(--card-bg);
        }
        .flash.ok { border-color: rgba(34, 197, 94, 0.5); color: #bbf7d0; }
        .flash.err { border-color: rgba(239, 68, 68, 0.5); color: #fecaca; }
        .flash[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="pill" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 19l-7-7 7-7"/>
                </svg>
                Retour au hub
            </a>
            <button class="pill" id="logout" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
                </svg>
                Déconnexion
            </button>
        </div>

        <header>
            <h1>Utilisateurs</h1>
            <p>Choisissez un compte pour voir et modifier les écrans auxquels il a accès.</p>
        </header>

        <div class="layout">
            <section class="panel">
                <h2>Comptes</h2>
                <div id="user-list"></div>
                <div class="actions">
                    <button class="btn" id="new-user" type="button">+ Nouveau compte</button>
                </div>
            </section>

            <section class="panel">
                <h2 id="editor-title">Nouveau compte</h2>

                <label for="username">Identifiant</label>
                <input type="text" id="username" autocomplete="off" spellcheck="false" placeholder="pndiaye">

                <label for="password">Mot de passe</label>
                <input type="password" id="password" autocomplete="new-password" placeholder="8 caractères minimum">
                <div class="help" id="password-help">8 caractères minimum.</div>

                <label for="role">Rôle</label>
                <select id="role">
                    <option value="user">Utilisateur — voit seulement ses écrans</option>
                    <option value="admin">Administrateur — gère aussi les comptes</option>
                </select>

                <div id="groups"></div>

                <div class="actions">
                    <button class="btn btn-primary" id="save" type="button">Enregistrer</button>
                    <button class="btn" id="cancel" type="button">Annuler</button>
                    <button class="btn btn-danger" id="delete" type="button" hidden>Supprimer ce compte</button>
                </div>

                <div class="flash" id="flash" hidden></div>
            </section>
        </div>
    </div>

    <script>
        const GROUP_LABEL = { general: 'Modules généraux', maas: 'Points de vente MAAS' };

        let modules = [];
        let users = [];
        let me = null;
        let editing = null; // null = création

        const $ = id => document.getElementById(id);

        function flash(message, kind) {
            const el = $('flash');
            el.textContent = message;
            el.className = 'flash ' + kind;
            el.hidden = false;
            if (kind === 'ok') setTimeout(() => { el.hidden = true; }, 4000);
        }

        async function api(method, url, body) {
            const res = await fetch(url, {
                method,
                headers: body ? { 'Content-Type': 'application/json' } : undefined,
                body: body ? JSON.stringify(body) : undefined
            });
            let data = {};
            try { data = await res.json(); } catch (err) { /* 204 and friends */ }
            if (!res.ok) throw new Error(data.error || 'request_failed');
            return data;
        }

        const ERRORS = {
            invalid_username: "Identifiant invalide : 2 à 40 caractères, lettres, chiffres, . _ - @",
            weak_password: 'Mot de passe trop court : 8 caractères minimum.',
            username_taken: 'Cet identifiant existe déjà.',
            unknown_user: 'Ce compte n’existe plus.',
            password_required: 'Ce compte a besoin d’un mot de passe.',
            last_admin: 'Impossible : il doit rester au moins un administrateur.',
            cannot_delete_self: 'Vous ne pouvez pas supprimer votre propre compte.',
            forbidden: 'Réservé aux administrateurs.'
        };
        const say = code => ERRORS[code] || 'Échec de l’opération (' + code + ').';

        function renderGroups() {
            const wrap = $('groups');
            wrap.textContent = '';
            for (const group of ['general', 'maas']) {
                const inGroup = modules.filter(m => m.group === group);
                if (!inGroup.length) continue;

                const head = document.createElement('div');
                head.className = 'group-head';
                const title = document.createElement('span');
                title.textContent = GROUP_LABEL[group] + ' (' + inGroup.length + ')';
                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'mini';
                toggle.textContent = 'Tout cocher / décocher';
                toggle.addEventListener('click', () => {
                    const boxes = inGroup.map(m => $('mod-' + m.id));
                    const target = !boxes.every(b => b.checked);
                    boxes.forEach(b => { b.checked = target; });
                });
                head.append(title, toggle);

                const grid = document.createElement('div');
                grid.className = 'checks';
                for (const m of inGroup) {
                    const label = document.createElement('label');
                    label.className = 'check';
                    const box = document.createElement('input');
                    box.type = 'checkbox';
                    box.id = 'mod-' + m.id;
                    box.value = m.id;
                    const text = document.createElement('span');
                    text.textContent = m.name;
                    label.append(box, text);
                    grid.append(label);
                }
                wrap.append(head, grid);
            }
        }

        // Keep the order the account already had, so saving a form without
        // reordering anything does not reshuffle somebody's cards. Newly ticked
        // modules land at the end, in catalogue order.
        function checkedModules() {
            const ticked = new Set(modules.filter(m => $('mod-' + m.id).checked).map(m => m.id));
            const current = editing ? (users.find(u => u.username === editing) || {}).modules || [] : [];
            const kept = current.filter(id => ticked.has(id));
            const added = modules.filter(m => ticked.has(m.id) && !kept.includes(m.id)).map(m => m.id);
            return [...kept, ...added];
        }

        function setChecked(ids) {
            const set = new Set(ids || []);
            modules.forEach(m => { $('mod-' + m.id).checked = set.has(m.id); });
        }

        function renderUsers() {
            const list = $('user-list');
            list.textContent = '';
            for (const u of users) {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'user-row';
                row.setAttribute('aria-selected', String(editing === u.username));

                const who = document.createElement('div');
                who.className = 'who';
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = u.username;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = u.modules.length + (u.modules.length > 1 ? ' écrans' : ' écran');
                who.append(name, meta);

                const tag = document.createElement('span');
                tag.className = 'tag' + (u.role === 'admin' ? ' admin' : '');
                tag.textContent = u.role === 'admin' ? 'admin' : 'user';

                row.append(who, tag);
                row.addEventListener('click', () => select(u.username));
                list.append(row);
            }
        }

        function select(username) {
            const u = users.find(x => x.username === username);
            if (!u) return;
            editing = u.username;
            $('editor-title').textContent = 'Compte · ' + u.username;
            $('username').value = u.username;
            $('username').disabled = true;
            $('password').value = '';
            $('password-help').textContent = 'Laissez vide pour conserver le mot de passe actuel.';
            $('role').value = u.role;
            setChecked(u.modules);
            $('delete').hidden = false;
            $('flash').hidden = true;
            renderUsers();
        }

        function reset() {
            editing = null;
            $('editor-title').textContent = 'Nouveau compte';
            $('username').value = '';
            $('username').disabled = false;
            $('password').value = '';
            $('password-help').textContent = '8 caractères minimum.';
            $('role').value = 'user';
            setChecked([]);
            $('delete').hidden = true;
            $('flash').hidden = true;
            renderUsers();
        }

        async function refresh() {
            users = await api('GET', '/api/users');
            renderUsers();
        }

        $('save').addEventListener('click', async () => {
            const btn = $('save');
            btn.disabled = true;
            try {
                const body = { role: $('role').value, modules: checkedModules() };
                if (editing) {
                    if ($('password').value) body.password = $('password').value;
                    await api('PUT', '/api/users/' + encodeURIComponent(editing), body);
                    flash('Compte « ' + editing + ' » enregistré.', 'ok');
                    const keep = editing;
                    await refresh();
                    select(keep);
                } else {
                    body.username = $('username').value.trim();
                    body.password = $('password').value;
                    await api('POST', '/api/users', body);
                    const created = body.username;
                    await refresh();
                    select(created);
                    flash('Compte « ' + created + ' » créé.', 'ok');
                }
            } catch (err) {
                flash(say(err.message), 'err');
            } finally {
                btn.disabled = false;
            }
        });

        $('delete').addEventListener('click', async () => {
            if (!editing) return;
            if (!confirm('Supprimer définitivement le compte « ' + editing + ' » ?')) return;
            try {
                await api('DELETE', '/api/users/' + encodeURIComponent(editing));
                const gone = editing;
                reset();
                await refresh();
                flash('Compte « ' + gone + ' » supprimé.', 'ok');
            } catch (err) {
                flash(say(err.message), 'err');
            }
        });

        $('new-user').addEventListener('click', reset);
        $('cancel').addEventListener('click', reset);

        $('logout').addEventListener('click', async () => {
            $('logout').disabled = true;
            try { await fetch('/logout', { method: 'POST' }); } catch (err) { /* ignore */ }
            location.replace('/login');
        });

        (async function start() {
            try {
                me = await api('GET', '/api/me');
                modules = await api('GET', '/api/modules');
                renderGroups();
                await refresh();
                reset();
            } catch (err) {
                flash('Chargement impossible : ' + say(err.message), 'err');
            }
        })();
    </script>
</body>
</html>
